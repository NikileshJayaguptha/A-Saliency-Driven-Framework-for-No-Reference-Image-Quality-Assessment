<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Quality Scorer</title>
<style>
  :root{
    --bg:#f5f3ef; --panel:#ffffff; --ink:#1d1c1a; --muted:#6f6b64; --line:#e3dfd8;
    --accent:#2f5d50; --accent-soft:#e3ece8; --bad:#b4442e; --mid:#c28a1e; --good:#2f7d4f;
    --radius:14px; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141412; --panel:#1d1d1a; --ink:#ece9e3; --muted:#9b968d; --line:#2d2c28;
           --accent:#7fb8a4; --accent-soft:#22302b; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:980px;margin:0 auto;padding:40px 16px 64px}
  header h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}
  header p{margin:0;color:var(--muted)}
  .status{font:12px var(--mono);color:var(--muted);margin-top:8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  #drop{display:flex;flex-direction:column;align-items:center;justify-content:center;
        min-height:340px;border:2px dashed var(--line);border-radius:var(--radius);
        cursor:pointer;text-align:center;padding:16px;transition:border-color .15s,background .15s;position:relative;overflow:hidden}
  #drop.over{border-color:var(--accent);background:var(--accent-soft)}
  #drop img{max-width:100%;max-height:420px;border-radius:8px;display:block}
  #drop .hint b{color:var(--accent)}
  #drop .hint small{display:block;color:var(--muted);margin-top:6px}
  .toggle{display:flex;gap:6px;margin-top:12px}
  .toggle button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);
                 padding:8px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
  .toggle button.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
  .toggle button:disabled{opacity:.4;cursor:default}
  .score{font-size:72px;font-weight:650;letter-spacing:-.04em;line-height:1;margin:6px 0}
  .score span{font-size:22px;color:var(--muted);font-weight:400;letter-spacing:0}
  .label{display:inline-block;padding:3px 12px;border-radius:99px;font-size:14px;font-weight:600}
  .bar{position:relative;height:10px;border-radius:99px;margin:22px 0 6px;
       background:linear-gradient(90deg,var(--bad),var(--mid) 50%,var(--good))}
  .bar i{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--ink);
         transform:translateX(-2px);transition:left .5s cubic-bezier(.2,.8,.2,1)}
  .ticks{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted)}
  dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:22px 0 0;font-size:14px}
  dt{color:var(--muted)} dd{margin:0;font-family:var(--mono)}
  .empty{color:var(--muted);display:flex;align-items:center;justify-content:center;min-height:300px;text-align:center}
  .spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);
           border-radius:50%;animation:spin .8s linear infinite;margin:auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{color:var(--bad)}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
  #history{margin-top:20px}
  #history table{width:100%;border-collapse:collapse;font-size:14px}
  #history td{padding:8px 4px;border-top:1px solid var(--line)}
  #history td:last-child{text-align:right;font-family:var(--mono)}
  #history img{width:40px;height:40px;object-fit:cover;border-radius:6px;vertical-align:middle}
</style>
</head>
<body>
<main>
  <header>
    <h1>Image Quality Scorer</h1>
    <p>Saliency-guided Swin + VGG model. Drop an image to get a predicted quality score.</p>
    <div class="status" id="status">checking model…</div>
  </header>

  <div class="grid">
    <section class="card">
      <label id="drop">
        <input type="file" id="file" accept="image/*" hidden>
        <div class="hint"><b>Choose an image</b> or drag it here<small>JPG, PNG, BMP, WEBP · up to 20 MB</small></div>
      </label>
      <div class="toggle">
        <button id="vOrig" class="on" disabled>Original</button>
        <button id="vSal" disabled>Saliency map</button>
      </div>
    </section>

    <section class="card" id="result">
      <div class="empty">Your score will appear here.</div>
    </section>
  </div>

  <section class="card" id="history" hidden>
    <h2>This session</h2>
    <table><tbody id="hist"></tbody></table>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), fileIn = $('#file'), result = $('#result');
let origURL = null, salURL = null, scale = [1,5];

fetch('/api/health').then(r=>r.json()).then(h=>{
  if (h.scale) scale = h.scale;
  $('#status').textContent = `model ready · ${h.device} · scale ${scale[0]}–${scale[1]}`;
}).catch(()=> $('#status').textContent = 'model not reachable');

['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) score(f); });
fileIn.addEventListener('change', () => { if (fileIn.files[0]) score(fileIn.files[0]); fileIn.value=''; });

function show(url){ drop.querySelector('.hint')?.remove(); let img = drop.querySelector('img');
  if(!img){ img = document.createElement('img'); drop.appendChild(img); } img.src = url; }
$('#vOrig').onclick = () => { show(origURL); $('#vOrig').classList.add('on'); $('#vSal').classList.remove('on'); };
$('#vSal').onclick  = () => { if(salURL){ show(salURL); $('#vSal').classList.add('on'); $('#vOrig').classList.remove('on'); } };

const colorFor = n => n >= .6 ? 'var(--good)' : n >= .4 ? 'var(--mid)' : 'var(--bad)';

async function score(file){
  origURL = URL.createObjectURL(file); salURL = null;
  show(origURL); $('#vOrig').click(); $('#vSal').disabled = true; $('#vOrig').disabled = false;
  result.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  const fd = new FormData(); fd.append('file', file);
  try {
    const r = await fetch('/api/predict', {method:'POST', body:fd});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    if (d.saliency_png){ salURL = 'data:image/png;base64,' + d.saliency_png; $('#vSal').disabled = false; }
    const n = Math.min(Math.max(d.normalized,0),1), c = colorFor(n);
    result.innerHTML = `
      <h2>Predicted quality</h2>
      <div class="score">${d.score.toFixed(2)} <span>/ ${d.scale_max}</span></div>
      <span class="label" style="background:color-mix(in srgb, ${c} 18%, transparent);color:${c}">${d.label}</span>
      <div class="bar"><i style="left:0%"></i></div>
      <div class="ticks"><span>${d.scale_min}</span><span>${(d.scale_min+d.scale_max)/2}</span><span>${d.scale_max}</span></div>
      <dl>
        <dt>Normalized</dt><dd>${d.normalized.toFixed(4)}</dd>
        <dt>File</dt><dd>${esc(d.filename)}</dd>
        <dt>Size</dt><dd>${d.width} × ${d.height}</dd>
        <dt>Inference</dt><dd>${d.inference_ms} ms</dd>
      </dl>`;
    requestAnimationFrame(()=> result.querySelector('.bar i').style.left = (n*100)+'%');
    addHistory(origURL, d);
  } catch(e){
    result.innerHTML = `<div class="empty err">${esc(e.message)}</div>`;
  }
}
function addHistory(url, d){
  $('#history').hidden = false;
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><img src="${url}"></td><td>${esc(d.filename)}</td><td>${d.label}</td><td>${d.score.toFixed(2)}</td>`;
  $('#hist').prepend(tr);
}
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
</body>
</html>
